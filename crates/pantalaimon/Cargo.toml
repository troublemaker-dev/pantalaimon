[package]
name = "pantalaimon"
version = "0.11.0"
edition = "2021"
description = "E2E encryption-aware Matrix reverse proxy daemon"
license = "Apache-2.0"

[[bin]]
name = "pantalaimon"
path = "src/main.rs"

[features]
default = []
# Enable D-Bus UI (requires a running D-Bus session bus)
ui = ["dep:zbus"]

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
sqlx = { workspace = true }
keyring = { workspace = true }
configparser = { workspace = true }
dashmap = { workspace = true }
bytes = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
url = { workspace = true }
indexmap = { workspace = true }

zbus = { version = "4", default-features = false, features = ["tokio"], optional = true }

# Phase 3: E2E crypto via Vodozemac.
# matrix-sdk-sqlite is intentionally excluded to avoid a libsqlite3-sys
# version conflict with sqlx; we use MemoryStore for now (Phase 7 will add
# persistence via a custom CryptoStore backed by sqlx).
matrix-sdk-crypto = { workspace = true }
ruma = { workspace = true }
